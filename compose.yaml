# ─────────────────────────────────────────────────────────────────────────────
# Genmars client portal — app.genmars.co.ke + api.genmars.co.ke
#
#   docker compose up -d --build      build and run
#   docker compose logs -f api        follow the API log
#   docker compose exec api python manage.py migrate
#   docker compose down               stop (data survives — volumes are named)
#
# ── THE BINDING RULE ────────────────────────────────────────────────────────
# api and web publish to 127.0.0.1 ONLY. The host Caddy proxies to them and
# terminates TLS; nothing here is reachable from the network.
#
# "8010:8010" would bind 0.0.0.0 and expose the API over plain HTTP to the
# internet, bypassing TLS entirely — and a UFW "deny" would NOT stop it, because
# Docker writes its own iptables rules ahead of UFW's. The 127.0.0.1 prefix is
# what actually closes the port.
#
# db and redis publish NOTHING. They are reachable only over the compose network,
# by name, from the other containers.
# ─────────────────────────────────────────────────────────────────────────────

name: genmars-portal

services:
  # ---- database ------------------------------------------------------------

  db:
    image: postgres:16-alpine
    container_name: genmars-portal-db

    networks:
      - data
    restart: unless-stopped

    # No `ports:`. Deliberate — see the binding rule above. The only way in is
    # the compose network or `docker compose exec`.

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genmars_portal}
      POSTGRES_USER: ${POSTGRES_USER:-genmars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Fail fast on an unclean init rather than silently building a database
      # with different collation rules than the backups were taken under.
      POSTGRES_INITDB_ARGS: "--data-checksums"

    volumes:
      - portal-db:/var/lib/postgresql/data
      # Backups land on the host so they survive `docker compose down -v` and
      # can be copied off the box. A backup that only exists inside the thing it
      # is backing up is not a backup.
      - ./backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genmars} -d ${POSTGRES_DB:-genmars_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    # ── A CEILING, BECAUSE THIS HOST IS SHARED ──────────────────────────────
    # clipsserenityspa.co.ke — a LIVE CLIENT SITE — runs on this same machine,
    # as does the Genmars marketing site. An unbounded Postgres can grow until
    # the kernel starts OOM-killing, and the process it picks is not necessarily
    # ours. A client's site must not be able to die because our database got
    # busy.
    #
    # shared_buffers defaults to 128MB, so 512M leaves real headroom for work
    # memory and connections at this size. Raise it deliberately if the data
    # grows; do not remove it.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---- cache / throttle counters -------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: genmars-portal-redis

    networks:
      - data
    restart: unless-stopped

    # Rate-limit counters live here. `--save ""` disables RDB snapshots: losing
    # them on restart resets throttle windows, which is acceptable, and it keeps
    # the container from needing a writable data volume.
    # ── WHY THERE IS A PASSWORD ON A "PRIVATE" SERVICE ──────────────────────
    #
    # It was reachable, unauthenticated, from every container on this network —
    # which included both Next.js frontends, the largest attack surface in the
    # stack. `redis-cli PING` from the operations container answered PONG.
    #
    # What that exposed is not obvious until you look: the throttle keys are
    # named after the thing being throttled, so they read
    # `throttle:email:auth_sign_in:someone@example.com` — client email
    # addresses, listable by anything that could open a socket. And deleting
    # them resets the rate limiting that protects sign-in and verification
    # codes from being brute-forced or used to send mail.
    #
    # The network is segmented below so nothing but the API can reach this at
    # all. The password is the second lock, for the day something ends up on
    # the wrong network by accident — which is exactly how this happened.
    environment:
      # Only so the healthcheck can authenticate. The server reads it from the
      # command line below, not from here.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"

    healthcheck:
      # Authenticated, or the healthcheck reports a healthy container that the
      # application cannot actually use.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

    # Run as the image's own redis user (999:1000), NOT as root.
    #
    # Without this the container will not start at all. The official entrypoint
    # chowns /data when it is running as root, and `cap_drop: ALL` has taken
    # CAP_CHOWN away — so it fails, restarts, and fails again, logging only
    # "chown: .: Operation not permitted" while `api` waits forever on a
    # dependency that never becomes healthy. Starting as the target user skips
    # that branch entirely.
    user: "999:1000"

    read_only: true
    # uid/gid must match the user above: the tmpfs is created root-owned at
    # mode 0770, which an unprivileged redis cannot enter, and it can no longer
    # chown its way in.
    tmpfs:
      - /data:size=8m,mode=0770,uid=999,gid=1000,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # `--maxmemory 128mb` above is Redis policing ITSELF, which it only does for
    # keys it knows about. This is the kernel policing Redis, which is what
    # actually holds on a shared host. The gap between the two covers
    # fragmentation and buffers.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          memory: 32M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Django API ----------------------------------------------------------

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/genmarstech/gen-portal-api:latest
    container_name: genmars-portal-api

    volumes:
      # Runbooks, read-only. They live on the HOST on purpose: a runbook
      # readable only inside the portal is useless during the outage it
      # was written for. Mounted rather than baked in so editing one and
      # running `load_runbooks` needs no rebuild.
      - ./docs/runbooks:/app/docs/runbooks:ro

    networks:
      - data
      - edge
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-genmars}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-genmars_portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

    # Loopback only. Do not change to "8010:8010".
    ports:
      - "127.0.0.1:8010:8010"

    # ── NO STATIC BIND MOUNT — THIS WAS A BUG ───────────────────────────────
    # `- ./staticfiles:/app/staticfiles:ro` looks right and is wrong. The image
    # already contains the collectstatic output, built at image build time. Bind
    # mounting the host directory over that path MASKS it: on a fresh clone the
    # host directory is empty, so the container serves nothing, Caddy serves
    # nothing, and the admin renders with no CSS — for a reason that is invisible
    # in every log.
    #
    # Static files are copied OUT of the image instead, once per deploy:
    #
    #     docker compose cp api:/app/staticfiles ./staticfiles
    #
    # Explicit, ordinary to reason about, and it cannot silently hide the thing
    # it is meant to publish. See step 5 of docs/DEPLOYMENT.md.

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # NOT read_only. Python writes bytecode caches and gunicorn needs a
    # scratch dir; forcing read-only here would buy very little and cost a class
    # of confusing boot failures. The container is non-root with no capabilities,
    # which is where the real protection is.

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---- Next.js frontend ----------------------------------------------------

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Must match the `environment:` value below, and it is the one that
      # actually takes effect — Next resolves rewrites at BUILD time. See the
      # comment on ARG API_ORIGIN in frontend/Dockerfile before changing either.
      args:
        API_ORIGIN: http://api:8010
    image: ghcr.io/genmarstech/gen-portal-web:latest
    container_name: genmars-portal-web

    networks:
      - edge
    restart: unless-stopped

    depends_on:
      - api

    environment:
      # Server-side rewrites reach Django over the compose network by name.
      # In the browser everything is same-origin through Caddy, so this is only
      # for requests Next itself makes.
      #
      # Kept for readability and for anything that reads it at runtime, but the
      # REWRITE is decided by the build arg above — this value alone does not
      # change where /api/* goes.
      API_ORIGIN: http://api:8010

    # Loopback only. Do not change to "3010:3010".
    ports:
      - "127.0.0.1:3010:3010"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          memory: 96M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  portal-db:

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
#
# ── WHY THERE ARE TWO ───────────────────────────────────────────────────────
#
# There was one, and everything sat on it: Postgres, Redis, Django, the portal
# frontend, and — joining from its own compose project — the operations
# frontend. Two Next.js servers, the largest attack surface in the stack, with
# a route to the database port and to an unauthenticated Redis.
#
# Nothing was exploited. It was simply a path that had no reason to exist:
# neither frontend speaks to Postgres or Redis. They speak to Django, and
# Django speaks to the data.
#
#   data   db, redis, api          the stores and the only thing that reads them
#   edge   api, web, and ops       HTTP between the frontends and Django
#
# `api` is deliberately the only service on both. That is the whole shape of
# it: one door between the part that faces the internet and the part that
# holds the data.
networks:
  data:
    name: genmars-portal_data
  edge:
    # Named explicitly because internals-tm joins it from another compose
    # project by name — see that repository's compose.yaml.
    name: genmars-portal_edge
